# Netlify hosts the static demo UI (web/). The TOTP API itself runs on free
# compute elsewhere (Render — see render.yaml) backed by Supabase Postgres.
#
# After deploy, open the site, expand "Settings", and set "API base URL" to your
# running server, e.g. https://totp-api.example.com
#
# To proxy the API through Netlify instead (so the UI can use same-origin calls),
# set API_ORIGIN as a build/deploy environment variable and uncomment the
# redirect block below.

[build]
  publish = "web"
  command = "echo 'static site — nothing to build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *"

# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-API-HOST/api/:splat"
#   status = 200
#   force = true
